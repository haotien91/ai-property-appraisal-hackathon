    <style>
        .workspace-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 18px;
            align-items: stretch;
        }
/* 下載按鈕：綠色 outline 風格 */
.download-row .btn-download {
    color: #34d399;                      /* 綠色文字 */
    background: rgba(52, 211, 153, .06); /* 極淡綠底,近乎透明 */
    border: 1px solid rgba(52, 211, 153, .55); /* 綠色描邊 */
    font-weight: 700;
    transition: .18s ease;
}

.download-row .btn-download:hover {
    color: #fff;
    background: rgba(52, 211, 153, .16);
    border-color: #34d399;
}

.download-row .btn-download:disabled,
.download-row .btn-download[disabled] {
    color: var(--ai-muted);
    background: rgba(255,255,255,.025);
    border-color: var(--ai-border);
    opacity: .7;
}

        .workspace-panel {
            min-width: 0;
            border: 1px solid var(--ai-border);
            border-radius: 12px;
            background: var(--ai-panel);
            overflow: hidden;
        }

        .workspace-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 16px 18px;
            border-bottom: 1px solid var(--ai-border);
            background: rgba(255,255,255,.025);
        }

        .workspace-title {
            margin: 0;
            color: #fff;
            font-size: 1rem;
            font-weight: 800;
        }

        .workspace-subtitle {
            margin: 4px 0 0;
            color: var(--ai-muted);
            font-size: .82rem;
        }

        .pdf-switcher {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            padding: 14px;
            border-bottom: 1px solid var(--ai-border);
        }

        .pdf-switch-btn {
            min-height: 44px;
            border: 1px solid var(--ai-border);
            border-radius: 8px;
            background: rgba(255,255,255,.025);
            color: var(--ai-muted);
            font-weight: 700;
            font-size: .86rem;
            transition: .2s ease;
        }

        .pdf-switch-btn:hover,
        .pdf-switch-btn.active {
            color: #fff;
            border-color: var(--ai-accent);
            background: var(--ai-accent-soft);
        }

        .pdf-viewer-frame {
            display: block;
            width: 100%;
            height: 680px;
            border: 0;
            background: #fff;
        }

        .download-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            padding: 14px;
            border-top: 1px solid var(--ai-border);
        }

        .download-row .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 9px 12px;
            font-size: .84rem;
            white-space: normal;
            line-height: 1.3;
        }

        .chat-panel {
            display: flex;
            flex-direction: column;
            min-height: 790px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 18px;
            background: linear-gradient(180deg, rgba(255,255,255,.012), transparent);
        }

        .chat-message {
            display: flex;
            margin-bottom: 14px;
        }

        .chat-message.user {
            justify-content: flex-end;
        }

        .chat-bubble {
            max-width: 82%;
            padding: 12px 14px;
            border-radius: 12px;
            line-height: 1.65;
            font-size: .92rem;
            white-space: pre-wrap;
        }

        .chat-message.ai .chat-bubble {
            color: #e9e9ed;
            background: #1d1d22;
            border: 1px solid var(--ai-border);
            border-top-left-radius: 4px;
        }

        .chat-message.user .chat-bubble {
            color: #fff;
            background: var(--ai-accent);
            border-top-right-radius: 4px;
        }

        .chat-context {
            padding: 10px 14px;
            border-top: 1px solid var(--ai-border);
            border-bottom: 1px solid var(--ai-border);
            color: var(--ai-muted);
            font-size: .8rem;
            background: rgba(255,255,255,.018);
        }

        .chat-input-wrap {
            display: grid;
            grid-template-columns: minmax(0,1fr) auto;
            gap: 10px;
            padding: 14px;
        }

        .chat-input {
            min-width: 0;
            min-height: 46px;
            resize: none;
            border: 1px solid var(--ai-border);
            border-radius: 10px;
            padding: 11px 12px;
            color: #fff;
            background: #111114;
            outline: none;
        }

        .chat-input:focus {
            border-color: var(--ai-accent);
        }

        .chat-send {
            min-width: 52px;
            border: 0;
            border-radius: 10px;
            color: #fff;
            background: var(--ai-accent);
        }

        .chat-note {
            padding: 0 14px 14px;
            color: #ffb020;
            font-size: .78rem;
        }

        .page-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }

        @media (max-width: 1199.98px) {
            .workspace-grid {
                grid-template-columns: 1fr;
            }

            .chat-panel {
                min-height: 620px;
            }

            .pdf-viewer-frame {
                height: 620px;
            }
        }

        @media (max-width: 767.98px) {
            .pdf-switcher,
            .download-row {
                grid-template-columns: 1fr;
            }

            .pdf-viewer-frame {
                height: 520px;
            }

            .chat-panel {
                min-height: 560px;
            }

            .page-actions .btn {
                width: 100%;
            }
        }
        @media (min-width: 992px) {
            body.pdf-workspace-page .app-shell { height: calc(100dvh - 76px); padding: 14px 0 28px; }
            .pdf-workspace-page .app-shell > .container-fluid { height: 100%; display: flex; flex-direction: column; }
            .pdf-workspace-page .app-stepper { flex-shrink: 0; margin-bottom: 14px; padding-bottom: 10px; }
            #content { flex: 1; min-height: 0; }
            #content:not([style*="display:none"]):not([style*="display: none"]) { display: flex !important; flex-direction: column; }
            .workspace-grid { flex: 1; min-height: 0; grid-template-columns: minmax(0,3fr) minmax(280px,1fr); gap: 12px; }
            .chat-panel .workspace-header { flex-wrap: wrap; gap: 6px; }
            .chat-panel .chat-bubble { max-width: 100%; font-size: .84rem; padding: 10px 12px; }
            .workspace-panel { display: flex; flex-direction: column; min-height: 0; }
            .workspace-header { padding: 10px 14px; flex-shrink: 0; }
            .workspace-header .btn { padding: 7px 10px; font-size: .78rem; }
            .workspace-subtitle { font-size: .76rem; }
            .pdf-switcher, .download-row { padding: 8px; gap: 6px; flex-shrink: 0; }
            .pdf-switch-btn { min-height: 36px; font-size: .74rem; padding: 5px; }
            .download-row .btn { min-height: 32px; padding: 5px; font-size: .72rem; }
            .pdf-viewer-frame { flex: 1; min-height: 0; height: 0; }
            .chat-messages { min-height: 0; padding: 12px; overscroll-behavior: contain; }
            .chat-context { padding: 7px 12px; flex-shrink: 0; }
            .chat-input-wrap { padding: 10px 12px; flex-shrink: 0; }
            .chat-note { padding: 0 12px 8px; font-size: .72rem; flex-shrink: 0; }
            .page-actions { margin-top: 10px; flex-shrink: 0; }
            .page-actions .btn { padding: 7px 14px; font-size: .8rem; }
        }
        /* Keep the centered brand and workflow above the full-height document host. */
        @media (min-width: 992px) {
            .pdf-workspace-page .app-navbar { height: 76px; padding: 16px 20px; justify-content: center; }
            .pdf-workspace-page .app-navbar .navbar-brand { font-size: 19px; }
            body.pdf-workspace-page .app-shell { height: calc(100dvh - 76px); padding: 0; }
            .pdf-workspace-page .app-shell > .container-fluid { padding: 0 !important; }
            .pdf-workspace-page .app-stepper { position: static; transform: none; margin: 0; padding: 14px 12px 10px; border-bottom: 1px solid var(--ai-border); flex-wrap: nowrap; }
            .pdf-workspace-page .app-stepper a { font-size: .88rem; padding: 6px 14px 6px 6px; }
            .workspace-grid { grid-template-columns: minmax(0,1fr) minmax(300px,25%); gap: 10px; }
            .workspace-panel { border: 0; border-radius: 0; background: #19191c; }
            .workspace-panel:not(.chat-panel) > .workspace-header { display: none; }
            .document-toolbar { display: flex; align-items: center; flex-shrink: 0; min-height: 48px; background: #19191c; }
            .pdf-switcher { flex: 1; border: 0; padding: 4px 8px; display: flex; }
            .pdf-switch-btn { padding: 8px 12px; font-size: .8rem; }
            .document-downloads { position: relative; flex-shrink: 0; margin: 4px 10px; font-size: .78rem; }
            .document-downloads summary { cursor: pointer; padding: 7px 10px; color: #bcbcc4; border: 1px solid #343437; border-radius: 5px; }
            .document-downloads .download-row { position: absolute; top: 100%; right: 0; width: 280px; z-index: 5; display: grid; grid-template-columns: 1fr; background: #19191c; border: 1px solid #343437; }
            .chat-panel .workspace-header { min-height: 48px; padding: 8px 14px; }
            .chat-panel .workspace-subtitle { display: none; }
            .chat-panel .workspace-title { font-size: .85rem; }
            .chat-messages { padding: 24px 20px; }
            .chat-input-wrap { padding: 12px 16px; }
            .chat-input { min-height: 80px; font-size: .85rem; }
            /* The third workflow step already links to the same result page. */
            .page-actions { display: none; }
            .page-actions .btn { font-size: .72rem; padding: 5px 10px; }
            .pdf-workspace-page .mode-badge { display: none; }
        }
    </style>

<body class="pdf-workspace-page">
    <div class="container-fluid p-0">
        <nav class="navbar navbar-dark app-navbar" aria-label="網站標誌">
            <a href="index.html" class="navbar-brand">
                <i class="fa-solid fa-landmark" aria-hidden="true"></i><span>地價智審 <b>AI</b></span>
            </a>
        </nav>
    </div>

    <section class="app-shell">
        <div class="container-fluid px-3 px-lg-5">
            <div class="app-stepper">
                <a href="case-new.html?ui=file-list-13" class="done" data-preserve-case><span class="step-num">1</span>建立案件</a>
                <a href="pdf-preview.html?ui=reader-16" class="active" data-preserve-case><span class="step-num">2</span>PDF 預覽</a>
                <a href="result.html?ui=20260912-6" data-preserve-case><span class="step-num">3</span>案件結果</a>
            </div>

            <div id="loadingState" class="state-loading"><div class="spinner-border"></div></div>

            <div id="content" style="display:none;">
                <div class="workspace-grid">
                    <section class="workspace-panel">
                        <div class="workspace-header">
                            <div>
                                <h3 class="workspace-title"><i class="fa-solid fa-file-pdf me-2" style="color:var(--ai-accent);"></i>查估書表</h3>
                                <p id="activeFormTitle" class="workspace-subtitle">地價區段勘查表</p>
                            </div>
                            <a id="openCurrentPdf" class="btn btn-ai-outline btn-sm" target="_blank" rel="noopener">
                                <i class="fa-solid fa-up-right-from-square me-1"></i>另開 PDF
                            </a>
                        </div>

                        <div class="document-toolbar"><div id="previewTabs" class="pdf-switcher"></div><details class="document-downloads"><summary>下載書表</summary><div id="downloadLinks" class="download-row"></div></details></div>
                        <iframe id="pdfViewer" class="pdf-viewer-frame" title="查估書表 PDF 預覽"></iframe>

                    </section>

                    <section class="workspace-panel chat-panel">
                        <div class="workspace-header">
                            <div>
                                <h3 class="workspace-title"><i class="fa-solid fa-comments me-2" style="color:var(--ai-accent);"></i>AI 案件助理</h3>
                                <p class="workspace-subtitle">詢問評價基準、修正率、計算過程與最終價格</p>
                            </div>
                            <span class="badge-manual">LLM 待串接</span>
                        </div>

                        <div id="chatMessages" class="chat-messages">
                            <div class="chat-message ai">
                                <div class="chat-bubble">您好，我可以協助解釋這個案件的查估書表、評價基準與計算結果。\n\n例如你可以問：\n• 為什麼這個因素判定為「普通」？\n• 這個修正率是怎麼得到的？\n• 最終比較價格如何計算？</div>
                            </div>
                        </div>

                        <div id="chatContext" class="chat-context">目前檢視：地價區段勘查表</div>

                        <form id="chatForm" class="chat-input-wrap">
                            <textarea id="chatInput" class="chat-input" rows="1" placeholder="針對目前案件提出問題..." required></textarea>
                            <button id="chatSend" class="chat-send" type="submit" aria-label="送出問題"><i class="fa-solid fa-paper-plane"></i></button>
                        </form>
                        <div id="chatNote" class="chat-note">目前前端已完成對話介面；正式回答需串接後端 LLM API。</div>
                    </section>
                </div>

                <div class="page-actions">
                    <a href="result.html?ui=20260912-6" class="btn btn-ai-primary" data-preserve-case>
                        查看案件結果 <i class="fa-solid fa-arrow-right ms-2"></i>
                    </a>
                </div>
            </div>
        </div>
    </section>


    <div class="mode-badge"><i class="fa-solid fa-circle-info me-1"></i>Mode: <span id="modeIndicator">-</span></div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>

    <script>
        const mode = (window.APP_CONFIG || {}).MODE || 'unknown';
        document.getElementById('modeIndicator').textContent = mode;
        CaseContext.applyCaseQueryToLinks();

        // TEAM-PROJECT-MERGE-M1 backend-contract fix: the official output is ONE
        // 6-page PDF (表3 x4 個地價區段 + 表5-1 + 表4, see pdf/shulin_official_pdf_
        // renderer.py), never 表1 + 表5-2 + 表4 as three separate files. Tabs below
        // jump to a page range WITHIN that single PDF via the #page= fragment.
        const FORM_DEFS = [
            { key: 'table3', label: '表3 地價區段勘查表', icon: 'fa-map-location-dot', page: 1 },
            { key: 'table5_1', label: '表5-1 影響地價區域因素分析明細表', icon: 'fa-table-list', page: 5 },
            { key: 'table4', label: '表4 比較法調查估價表', icon: 'fa-calculator', page: 6 },
        ];
        // 表3 四頁的順序，見 pdf/shulin_official_pdf_renderer.py::TABLE3_PAGE_ORDER
        const TABLE3_SEGMENTS = [
            { code: 'P002-00', label: '比較標的1 (P002-00)', page: 1 },
            { code: 'P003-00', label: '比較標的2 (P003-00)', page: 2 },
            { code: 'P004-00', label: '比較標的3 (P004-00)', page: 3 },
            { code: 'P001-00', label: '比準地 (P001-00)', page: 4 },
        ];

        let activeFormKey = 'table3';
        let activeFormLabel = FORM_DEFS[0].label;

        function appendChat(role, text) {
            const wrap = document.getElementById('chatMessages');
            const item = document.createElement('div');
            item.className = `chat-message ${role}`;
            const bubble = document.createElement('div');
            bubble.className = 'chat-bubble';
            bubble.textContent = text;
            item.appendChild(bubble);
            wrap.appendChild(item);
            wrap.scrollTop = wrap.scrollHeight;
        }

        function mockAnswer(question) {
            const q = question.trim();
            if (!q) return '請輸入問題。';
            return `目前是前端 Mock 回覆。你正在檢視「${activeFormLabel}」。\n\n正式版會把這個問題、案件編號、目前 PDF、評價基準與後端計算追溯資料一起送給 LLM，再回傳有依據的說明。`;
        }

        (async () => {
            const caseNo = CaseContext.currentCaseNo();
            if (!caseNo) {
                document.getElementById('loadingState').innerHTML = '<div class="state-error">缺少案號，請先建立案件。</div>';
                return;
            }

            try {
                const official = await Api.getOfficialPdf(caseNo);
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                const pdfUrl = official.pdf_url;
                if (!pdfUrl) {
                    document.getElementById('content').style.display = 'none';
                    document.getElementById('loadingState').style.display = 'block';
                    document.getElementById('loadingState').innerHTML =
                        '<div class="state-error">正式 PDF 尚未產生（狀態：' + (official.status || 'UNKNOWN') + '）。</div>';
                    return;
                }

                const tabs = document.getElementById('previewTabs');
                tabs.innerHTML = FORM_DEFS.map((def, index) =>
                    `<button type="button" class="pdf-switch-btn${index === 0 ? ' active' : ''}" data-form-key="${def.key}">
                        <i class="fa-solid ${def.icon} me-1"></i>${def.label}
                    </button>`
                ).join('') +
                `<div id="table3SegmentRow" class="mt-2 d-flex flex-wrap gap-2">` +
                TABLE3_SEGMENTS.map((seg, i) =>
                    `<button type="button" class="pdf-switch-btn${i === 0 ? ' active' : ''}" data-page="${seg.page}" data-segment="${seg.code}">${seg.label}</button>`
                ).join('') + `</div>`;

                document.getElementById('downloadLinks').innerHTML =
                    `<a href="${pdfUrl}" target="_blank" rel="noopener" download="official_pdf_${caseNo}.pdf" class="btn btn-download"><i class="fa-solid fa-download me-1"></i>下載正式六頁 PDF</a>`;

                function showPage(page, label) {
                    activeFormLabel = label;
                    document.getElementById('activeFormTitle').textContent = label;
                    document.getElementById('pdfViewer').src = `${pdfUrl}#page=${page}&toolbar=1&navpanes=0&view=FitH`;
                    document.getElementById('openCurrentPdf').href = `${pdfUrl}#page=${page}`;
                    document.getElementById('chatContext').textContent = `目前檢視：${label}（第 ${page} 頁 / 共 6 頁）`;
                }

                tabs.addEventListener('click', event => {
                    const segBtn = event.target.closest('[data-segment]');
                    if (segBtn) {
                        activeFormKey = 'table3';
                        document.querySelectorAll('[data-segment]').forEach(b => b.classList.toggle('active', b === segBtn));
                        document.querySelectorAll('[data-form-key]').forEach(b => b.classList.toggle('active', b.dataset.formKey === 'table3'));
                        const seg = TABLE3_SEGMENTS.find(s => s.code === segBtn.dataset.segment);
                        document.getElementById('table3SegmentRow').style.display = '';
                        showPage(seg.page, `表3 地價區段勘查表 — ${seg.label}`);
                        return;
                    }
                    const btn = event.target.closest('[data-form-key]');
                    if (!btn) return;
                    activeFormKey = btn.dataset.formKey;
                    document.querySelectorAll('[data-form-key]').forEach(b => b.classList.toggle('active', b === btn));
                    const def = FORM_DEFS.find(d => d.key === btn.dataset.formKey);
                    document.getElementById('table3SegmentRow').style.display = def.key === 'table3' ? '' : 'none';
                    showPage(def.page, def.label);
                });

                showPage(FORM_DEFS[0].page, `表3 地價區段勘查表 — ${TABLE3_SEGMENTS[0].label}`);
            } catch (error) {
                document.getElementById('loadingState').innerHTML = '<div class="state-error">PDF 尚未產生或載入失敗。</div>';
            }
        })();

        document.getElementById('chatForm').addEventListener('submit', async event => {
            event.preventDefault();
            const input = document.getElementById('chatInput');
            const question = input.value.trim();
            if (!question) return;

            appendChat('user', question);
            input.value = '';

            try {
                const caseNo = CaseContext.currentCaseNo();
                if (typeof Api.askCaseAssistant === 'function') {
                    const response = await Api.askCaseAssistant({
                        case_no: caseNo,
                        form: activeFormKey,
                        question,
                    });
                    appendChat('ai', response.answer || '目前沒有可顯示的回答。');
                } else {
                    await new Promise(resolve => setTimeout(resolve, 450));
                    appendChat('ai', mockAnswer(question));
                }
            } catch (error) {
                appendChat('ai', 'AI 問答服務目前無法使用，請稍後再試。');
            }
        });
    </script>
</body>
</html>
