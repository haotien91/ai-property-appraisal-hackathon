<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>建立案件 · 地價智審 AI</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#111113;color:#ededf0}body{margin:0}header{padding:22px 32px;border-bottom:1px solid #303036}a{color:#ccc;text-decoration:none}main{max-width:660px;margin:54px auto;padding:0 24px}h1{font-size:32px;margin:0 0 12px}p{color:#aaaab5;line-height:1.7}form{margin-top:32px}label{display:block;margin:22px 0 10px;font-weight:600}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #44444e;border-radius:8px;background:#212125;color:#eee;font:inherit}input:focus-visible,button:focus-visible{outline:2px solid #ef8abd;outline-offset:3px}.file{padding:26px 20px;border:1px dashed #77717c;border-radius:10px;background:#19191d}.file input{border:0;padding:0;background:none}small{display:block;color:#9999a4;margin-top:12px;line-height:1.6}button{margin-top:30px;border:0;border-radius:8px;background:#de0876;color:white;padding:14px 26px;font:600 16px system-ui;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#status{white-space:pre-wrap;margin-top:24px;line-height:1.7}#status.error{color:#ff9ab5}#done{display:inline-block;margin-top:18px;color:#f18bbc}[hidden]{display:none!important}@media(max-width:600px){main{margin-top:32px}header{padding:18px 24px}}
</style></head><body><header><a href="index.html?data=live">← 案件庫</a></header><main><h1>建立案件</h1><p>匯入已生成的書表，加入案件庫。</p>
