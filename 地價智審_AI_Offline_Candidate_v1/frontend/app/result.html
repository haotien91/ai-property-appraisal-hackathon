<section class="app-shell"><div class="container"><div class="app-stepper"><a href="case.html" class="done" data-preserve-case><span class="step-num">1</span>案件列表</a><a href="case-new.html" class="done" data-preserve-case><span class="step-num">2</span>建立案件</a><a href="data.html" class="done" data-preserve-case><span class="step-num">3</span>資料收集</a><a href="analysis.html" class="done" data-preserve-case><span class="step-num">4</span>因素分析</a><a href="form-fill.html" class="done" data-preserve-case><span class="step-num">5</span>書表填寫</a><a href="pdf-preview.html" class="done" data-preserve-case><span class="step-num">6</span>PDF預覽</a><a href="document-review.html" class="" data-preserve-case><span class="step-num"><i class="fa-solid fa-file-import"></i></span>文件上傳（選用）</a><a href="review.html" class="done" data-preserve-case><span class="step-num">7</span>智慧審查</a><a href="result.html" class="active" data-preserve-case><span class="step-num">8</span>案件結果</a></div>
<h2 class="section-title" style="font-size:1.8rem;">案件結果</h2>
<p class="section-text mb-4">GET /api/cases/{id}/result —— 案件最終總覽。</p>
<div id="loadingState" class="state-loading"><div class="spinner-border"></div></div>
<div id="content" style="display:none;">
  <div class="app-card text-center mb-4">
    <p class="section-text mb-1">比準地比較價格</p>
    <div class="field-value-final" id="finalPrice">-</div>
    <p class="section-text mt-2" id="statusLine"></p>
  </div>
  <div class="row g-3 mb-4" id="reviewSummary"></div>
  <a id="pdfLink" href="pdf-preview.html" class="btn btn-ai-primary" data-preserve-case><i class="fa-solid fa-file-pdf me-2"></i>查看PDF</a>
  <a href="case.html" class="btn btn-ai-outline ms-2"><i class="fa-solid fa-list me-2"></i>返回案件列表</a>
</div>
<script>
(async () => {
    const caseNo = CaseContext.currentCaseNo();
    if (!caseNo) {
        document.getElementById('loadingState').innerHTML = '<div class="state-error">缺少案號（case_no），請從案件列表或建立案件重新進入。</div>';
        return;
    }
    try {
        const d = await Api.getResult(caseNo);
        document.getElementById('loadingState').style.display='none';
        document.getElementById('content').style.display='block';
        document.getElementById('finalPrice').textContent = (d.final_value && d.final_value.base_parcel_comparison_price) ?
            Number(d.final_value.base_parcel_comparison_price).toLocaleString() + ' 元/M²' : 'N/A';
        document.getElementById('statusLine').innerHTML = `狀態：<span class="badge-${d.status==='COMPLETED'?'passed':'manual'}">${d.status}</span>`;
        const rs = d.review_summary || {};
        document.getElementById('reviewSummary').innerHTML = Object.entries(rs).map(([k,v]) => `
            <div class="col-6 col-md-2"><div class="result-card"><span class="result-count">${v}</span><span class="result-label">${k}</span></div></div>
        `).join('');
    } catch (e) {
        document.getElementById('loadingState').innerHTML = '<div class="state-error">'+((e&&e.error&&e.error.message)||'尚無結果')+'</div>';
    }
})();
</script>
