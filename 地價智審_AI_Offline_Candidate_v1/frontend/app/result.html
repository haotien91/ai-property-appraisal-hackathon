<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>案件結果｜地價智審 AI</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="地價智審 AI, 案件結果, 不動產估價" name="keywords">
    <meta content="顯示案件最終估價結果與審查摘要。" name="description">

    <link href="img/favicon.ico" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="lib/lightbox/css/lightbox.min.css" rel="stylesheet">
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css?v=20260912-brand-6" rel="stylesheet">

    <style>
        .result-hero {
            padding: 34px;
            text-align: center;
            border: 1px solid var(--ai-border);
            border-radius: 12px;
            background: radial-gradient(circle at top, rgba(255,10,120,.12), transparent 44%), var(--ai-panel);
        }

        .result-meta {
            color: var(--ai-muted);
            font-size: .92rem;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0,1fr));
            gap: 12px;
            margin-top: 18px;
        }

        .summary-card {
            padding: 18px;
            border: 1px solid var(--ai-border);
            border-radius: 10px;
            background: var(--ai-panel);
            text-align: center;
        }

        .summary-card strong {
            display: block;
            color: #fff;
            font-size: 1.8rem;
            font-weight: 800;
        }

        .summary-card span {
            color: var(--ai-muted);
            font-size: .82rem;
        }

        .result-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 24px;
        }

        @media (max-width: 991.98px) {
            .summary-grid {
                grid-template-columns: repeat(2, minmax(0,1fr));
            }
        }

        @media (max-width: 575.98px) {
            .result-hero {
                padding: 24px 16px;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .result-actions .btn {
                width: 100%;
            }
        }
    </style>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/case-context.js"></script>
</head>

<body>
    <div class="container-fluid p-0">
        <nav class="navbar navbar-dark app-navbar" aria-label="網站標誌">
            <a href="index.html" class="navbar-brand">
                <i class="fa-solid fa-landmark" aria-hidden="true"></i><span>地價智審 <b>AI</b></span>
            </a>
        </nav>
    </div>

    <section class="app-shell">
        <div class="container">
            <div class="app-stepper">
                <a href="case-new.html?ui=file-list-13" class="done" data-preserve-case><span class="step-num">1</span>建立案件</a>
                <a href="pdf-preview.html?ui=reader-16" class="done" data-preserve-case><span class="step-num">2</span>PDF 預覽</a>
                <a href="result.html?ui=20260912-6" class="active" data-preserve-case><span class="step-num">3</span>案件結果</a>
            </div>

            <h2 class="section-title" style="font-size:1.8rem;">案件結果</h2>
            <p class="section-text mb-4">顯示本案件的最終估價結果與檢核摘要。</p>

            <div id="loadingState" class="state-loading"><div class="spinner-border"></div></div>

            <div id="content" style="display:none;">
                <div class="result-hero">
                    <p class="section-text mb-1">比準地比較價格</p>
                    <div id="finalPrice" class="field-value-final">-</div>
                    <p id="statusLine" class="result-meta mt-2 mb-0"></p>
                </div>

                <div id="reviewSummary" class="summary-grid"></div>

                <div class="result-actions">
                    <a href="pdf-preview.html?ui=reader-16" class="btn btn-ai-primary" data-preserve-case>
                        <i class="fa-solid fa-file-pdf me-2"></i>返回 PDF 與 AI 問答
                    </a>
                    <a href="case-new.html?ui=file-list-13" class="btn btn-ai-outline">
                        <i class="fa-solid fa-plus me-2"></i>建立新案件
                    </a>
                </div>
            </div>
        </div>
    </section>

    <footer class="container-fluid bg-dark text-light footer py-5">
        <div class="container text-center py-4">
            <a href="index.html" class="text-decoration-none"></a>
        </div>
    </footer>

    <div class="mode-badge"><i class="fa-solid fa-circle-info me-1"></i>Mode: <span id="modeIndicator">-</span></div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>

    <script>
        document.getElementById('modeIndicator').textContent = (window.APP_CONFIG || {}).MODE || 'unknown';
        CaseContext.applyCaseQueryToLinks();

        (async () => {
            const caseNo = CaseContext.currentCaseNo();
            if (!caseNo) {
                document.getElementById('loadingState').innerHTML = '<div class="state-error">缺少案號，請先建立案件。</div>';
                return;
            }

            try {
                const d = await Api.getResult(caseNo);
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                document.getElementById('finalPrice').textContent =
                    d.final_value && d.final_value.base_parcel_comparison_price
                        ? Number(d.final_value.base_parcel_comparison_price).toLocaleString() + ' 元/M²'
                        : 'N/A';

                document.getElementById('statusLine').innerHTML =
                    `案件 ${d.case_no || caseNo}　狀態：<span class="badge-${d.status === 'COMPLETED' ? 'passed' : 'manual'}">${d.status || 'UNKNOWN'}</span>`;

                const labels = {
                    passed: '通過',
                    error: '錯誤',
                    warning: '警告',
                    missing: '缺漏',
                    inconsistent: '不一致'
                };

                const rs = d.review_summary || {};
                document.getElementById('reviewSummary').innerHTML = Object.entries(labels).map(([key, label]) => `
                    <div class="summary-card">
                        <strong>${rs[key] ?? 0}</strong>
                        <span>${label}</span>
                    </div>
                `).join('');
            } catch (error) {
                document.getElementById('loadingState').innerHTML = '<div class="state-error">尚無案件結果或讀取失敗。</div>';
            }
        })();
    </script>
</body>
</html>
