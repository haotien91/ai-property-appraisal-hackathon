<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <title>地價智審 AI｜AI 輔助不動產估價案件審查</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="地價智審 AI, 不動產估價, AI 審查, 新北市 AI 智慧城市黑客松" name="keywords">
    <meta content="以 AI 文件理解、規則引擎、數值重算與跨表勾稽，協助不動產估價案件審查。" name="description">

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="lib/lightbox/css/lightbox.min.css" rel="stylesheet">
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">

    <link href="css/case-library.css" rel="stylesheet">
    <link href="css/group-workspace.css" rel="stylesheet">

    <style>
        body{background:#0b0b0d;font-family:"Noto Sans TC",sans-serif}
        .navbar{position:relative;background:#0b0b0d;border-bottom:1px solid #ffffff12}
        .navbar-brand h2{font-size:25px;margin:0}.navbar .navbar-nav .nav-link{padding:20px 0}
    </style>
</head>

<body>
    <section id="case-library" class="case-library">
        <div class="container">
            <div class="cl-workspace">
                <div class="cl-toolbar"><button type="button" class="cl-brand" id="cl-home" aria-label="地價智審 AI，返回地圖"><i class="fa-solid fa-landmark" aria-hidden="true"></i><span>地價智審 <b>AI</b></span></button>
                    <label class="cl-search" for="cl-search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="6" stroke="currentColor" stroke-width="1.5"/><path d="m15 15 5 5" stroke="currentColor" stroke-width="1.5"/></svg><input id="cl-search" type="search" placeholder="搜尋全市案名、案號或區段" aria-label="搜尋全市案件"></label>
                    <select id="cl-district-select" class="cl-select" aria-label="選擇行政區"></select>
                    <a class="cl-add" href="case-new.html">＋ 建立案件</a>
                </div>
                <div class="cl-main">
                    <div class="cl-intro" id="cl-intro">
                        <h1>選擇<br><span>行政區</span></h1>
                        <p>開啟案件，查看書表與計算依據。</p>
                    </div>
                    <div class="cl-map-panel" id="cl-map-panel">
                        <svg id="cl-map" class="cl-map" viewBox="14 14 580 560" role="group" aria-label="新北市行政區地圖，可用鍵盤或上方選單選擇行政區"></svg>


                    </div>
                    <div id="cl-divider" class="cl-divider" role="separator" aria-label="調整地圖與案件列表寬度" aria-orientation="vertical" aria-controls="cl-map-panel cl-shelf-panel" aria-valuemin="22" aria-valuemax="60" aria-valuenow="32" tabindex="0" hidden></div>
                    <div class="cl-shelf-panel" id="cl-shelf-panel" hidden><button type="button" id="cl-back" class="cl-text-button">關閉案件列表 ×</button>
                        <div class="cl-shelf-heading"><div><h3 id="cl-district-title" tabindex="-1"></h3><p id="cl-district-count"></p></div></div>
                        <div id="cl-books" class="cl-books"></div>
                        <p id="cl-results-message" class="visually-hidden" role="status" aria-live="polite"></p>

                    </div>
                </div>
            </div>
            <noscript><p>請啟用 JavaScript 以使用地圖與案件書櫃，也可直接前往<a href="case.html">案件列表</a>。</p></noscript>
        </div>
    </section>
    <dialog id="cl-dialog" class="cl-dialog" aria-labelledby="cl-detail-title">
        <div class="cl-dialog-top"><span id="cl-detail-district"></span><button id="cl-close" type="button" class="cl-close" aria-label="關閉案件">×</button></div>
        <div id="cl-title-area"><h2 id="cl-detail-title"></h2><button type="button" id="cl-edit-name" class="cl-text-button">✎ 修改案件名稱</button></div>
        <form id="cl-rename-form" class="cl-rename" hidden><label for="cl-name-input">案件顯示名稱（最多 60 字）</label><input id="cl-name-input" maxlength="60" autocomplete="off" aria-describedby="cl-name-error"><p id="cl-name-error" class="cl-error" role="alert"></p><div class="cl-rename-actions"><button type="submit" class="cl-add">儲存名稱</button><button type="button" id="cl-cancel-name" class="cl-text-button">取消</button></div></form>
        <dl id="cl-detail-meta"></dl>
        <div class="cl-group-heading"><h3>估價組別</h3><span id="cl-group-count"></span></div>
        <div id="cl-detail-groups" class="cl-groups"></div>
        <p class="cl-dialog-note">示範資料，文件尚未串接。</p>

    </dialog>
    <div id="cl-toast" class="cl-toast" role="status" hidden></div>


    <footer class="cl-minimal-footer">地價智審 AI <span>· 示範資料</span><small>Designed by 鳳梨戰士騎貢丸</small></footer>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="lib/owlcarousel/owl.carousel.min.js"></script>
    <script src="lib/lightbox/js/lightbox.min.js"></script>

    <!-- Template Javascript -->
    <script src="js/main.js"></script>
    <script src="data/ntpc-districts.js"></script>
    <script src="js/artifact-adapter.js?v=20260913-labels-3"></script>
    <script src="js/group-workspace.js?v=20260913-labels-3"></script>
    <script src="js/case-library.js?v=20260913-labels-3"></script>
</body>

</html>
