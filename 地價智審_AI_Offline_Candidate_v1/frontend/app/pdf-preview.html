<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <title>PDF 預覽｜地價智審 AI</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="地價智審 AI, PDF 預覽, AI 問答" name="keywords">
    <meta content="預覽查估書表並使用 AI 問答理解估價結果。" name="description">

    <link href="img/favicon.ico" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="lib/lightbox/css/lightbox.min.css" rel="stylesheet">
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css?v=20260912-brand-6" rel="stylesheet">

    <style>
        .workspace-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 18px;
            align-items: stretch;
        }
/* 下載按鈕：綠色 outline 風格 */
.download-row .btn-download {
    color: #34d399;                      /* 綠色文字 */
    background: rgba(52, 211, 153, .06); /* 極淡綠底,近乎透明 */
    border: 1px solid rgba(52, 211, 153, .55); /* 綠色描邊 */
    font-weight: 700;
    transition: .18s ease;
}

.download-row .btn-download:hover {
    color: #fff;
    background: rgba(52, 211, 153, .16);
    border-color: #34d399;
}

.download-row .btn-download:disabled,
.download-row .btn-download[disabled] {
    color: var(--ai-muted);
    background: rgba(255,255,255,.025);
    border-color: var(--ai-border);
    opacity: .7;
}

        .workspace-panel {
            min-width: 0;
            border: 1px solid var(--ai-border);
            border-radius: 12px;
            background: var(--ai-panel);
            overflow: hidden;
        }

        .workspace-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 16px 18px;
            border-bottom: 1px solid var(--ai-border);
            background: rgba(255,255,255,.025);
        }

        .workspace-title {
            margin: 0;
            color: #fff;
            font-size: 1rem;
            font-weight: 800;
        }

        .workspace-subtitle {
            margin: 4px 0 0;
            color: var(--ai-muted);
            font-size: .82rem;
        }

        .pdf-switcher {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            padding: 14px;
            border-bottom: 1px solid var(--ai-border);
        }

        .pdf-switch-btn {
            min-height: 44px;
            border: 1px solid var(--ai-border);
            border-radius: 8px;
            background: rgba(255,255,255,.025);
            color: var(--ai-muted);
            font-weight: 700;
            font-size: .86rem;
            transition: .2s ease;
        }

        .pdf-switch-btn:hover,
        .pdf-switch-btn.active {
            color: #fff;
            border-color: var(--ai-accent);
            background: var(--ai-accent-soft);
        }

        .pdf-viewer-frame {
            display: block;
            width: 100%;
            height: 680px;
            border: 0;
            background: #fff;
        }

        .download-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            padding: 14px;
            border-top: 1px solid var(--ai-border);
        }

        .download-row .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 9px 12px;
            font-size: .84rem;
            white-space: normal;
            line-height: 1.3;
        }

        .chat-panel {
            display: flex;
            flex-direction: column;
            min-height: 790px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 18px;
            background: linear-gradient(180deg, rgba(255,255,255,.012), transparent);
        }

        .chat-message {
            display: flex;
            margin-bottom: 14px;
        }

        .chat-message.user {
            justify-content: flex-end;
        }

        .chat-bubble {
            max-width: 82%;
            padding: 12px 14px;
            border-radius: 12px;
            line-height: 1.65;
            font-size: .92rem;
            white-space: pre-wrap;
        }

        .chat-message.ai .chat-bubble {
            color: #e9e9ed;
            background: #1d1d22;
            border: 1px solid var(--ai-border);
            border-top-left-radius: 4px;
        }

        .chat-message.user .chat-bubble {
            color: #fff;
            background: var(--ai-accent);
            border-top-right-radius: 4px;
        }

        .chat-context {
            padding: 10px 14px;
            border-top: 1px solid var(--ai-border);
            border-bottom: 1px solid var(--ai-border);
            color: var(--ai-muted);
            font-size: .8rem;
            background: rgba(255,255,255,.018);
        }

        .chat-input-wrap {
            display: grid;
            grid-template-columns: minmax(0,1fr) auto;
            gap: 10px;
            padding: 14px;
        }

        .chat-input {
            min-width: 0;
            min-height: 46px;
            resize: none;
            border: 1px solid var(--ai-border);
            border-radius: 10px;
            padding: 11px 12px;
            color: #fff;
            background: #111114;
            outline: none;
        }

        .chat-input:focus {
            border-color: var(--ai-accent);
        }

        .chat-send {
            min-width: 52px;
            border: 0;
            border-radius: 10px;
            color: #fff;
            background: var(--ai-accent);
        }

        .chat-note {
            padding: 0 14px 14px;
            color: #ffb020;
            font-size: .78rem;
        }

        .page-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }

        @media (max-width: 1199.98px) {
            .workspace-grid {
                grid-template-columns: 1fr;
            }

            .chat-panel {
                min-height: 620px;
            }

            .pdf-viewer-frame {
                height: 620px;
            }
        }

        @media (max-width: 767.98px) {
            .pdf-switcher,
            .download-row {
                grid-template-columns: 1fr;
            }

            .pdf-viewer-frame {
                height: 520px;
            }

            .chat-panel {
                min-height: 560px;
            }

            .page-actions .btn {
                width: 100%;
            }
        }
        @media (min-width: 992px) {
            body.pdf-workspace-page .app-shell { height: calc(100dvh - 76px); padding: 14px 0 28px; }
            .pdf-workspace-page .app-shell > .container-fluid { height: 100%; display: flex; flex-direction: column; }
            .pdf-workspace-page .app-stepper { flex-shrink: 0; margin-bottom: 14px; padding-bottom: 10px; }
            #content { flex: 1; min-height: 0; }
            #content:not([style*="display:none"]):not([style*="display: none"]) { display: flex !important; flex-direction: column; }
            .workspace-grid { flex: 1; min-height: 0; grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
            .workspace-panel { display: flex; flex-direction: column; min-height: 0; }
            .workspace-header { padding: 10px 14px; flex-shrink: 0; }
            .workspace-header .btn { padding: 7px 10px; font-size: .78rem; }
            .workspace-subtitle { font-size: .76rem; }
            .pdf-switcher, .download-row { padding: 8px; gap: 6px; flex-shrink: 0; }
            .pdf-switch-btn { min-height: 36px; font-size: .74rem; padding: 5px; }
            .download-row .btn { min-height: 32px; padding: 5px; font-size: .72rem; }
            .pdf-viewer-frame { flex: 1; min-height: 0; height: 0; }
            .chat-messages { min-height: 0; padding: 12px; overscroll-behavior: contain; }
            .chat-context { padding: 7px 12px; flex-shrink: 0; }
            .chat-input-wrap { padding: 10px 12px; flex-shrink: 0; }
            .chat-note { padding: 0 12px 8px; font-size: .72rem; flex-shrink: 0; }
            .page-actions { margin-top: 10px; flex-shrink: 0; }
            .page-actions .btn { padding: 7px 14px; font-size: .8rem; }
        }
    </style>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/case-context.js"></script>
</head>

<body class="pdf-workspace-page">
    <div class="container-fluid p-0">
        <nav class="navbar navbar-dark app-navbar" aria-label="網站標誌">
            <a href="index.html" class="navbar-brand">
                <i class="fa-solid fa-landmark" aria-hidden="true"></i><span>地價智審 <b>AI</b></span>
            </a>
        </nav>
    </div>

    <section class="app-shell">
        <div class="container-fluid px-3 px-lg-5">
            <div class="app-stepper">
                <a href="case-new.html?ui=file-list-13" class="done" data-preserve-case><span class="step-num">1</span>建立案件</a>
                <a href="pdf-preview.html?ui=workspace-10" class="active" data-preserve-case><span class="step-num">2</span>PDF 預覽</a>
                <a href="result.html?ui=20260912-6" data-preserve-case><span class="step-num">3</span>案件結果</a>
            </div>

            <div id="loadingState" class="state-loading"><div class="spinner-border"></div></div>

            <div id="content" style="display:none;">
                <div class="workspace-grid">
                    <section class="workspace-panel">
                        <div class="workspace-header">
                            <div>
                                <h3 class="workspace-title"><i class="fa-solid fa-file-pdf me-2" style="color:var(--ai-accent);"></i>查估書表</h3>
                                <p id="activeFormTitle" class="workspace-subtitle">地價區段勘查表</p>
                            </div>
                            <a id="openCurrentPdf" class="btn btn-ai-outline btn-sm" target="_blank" rel="noopener">
                                <i class="fa-solid fa-up-right-from-square me-1"></i>另開 PDF
                            </a>
                        </div>

                        <div id="previewTabs" class="pdf-switcher"></div>
                        <iframe id="pdfViewer" class="pdf-viewer-frame" title="查估書表 PDF 預覽"></iframe>
                        <div id="downloadLinks" class="download-row"></div>
                    </section>

                    <section class="workspace-panel chat-panel">
                        <div class="workspace-header">
                            <div>
                                <h3 class="workspace-title"><i class="fa-solid fa-comments me-2" style="color:var(--ai-accent);"></i>AI 案件助理</h3>
                                <p class="workspace-subtitle">詢問評價基準、修正率、計算過程與最終價格</p>
                            </div>
                            <span class="badge-manual">LLM 待串接</span>
                        </div>

                        <div id="chatMessages" class="chat-messages">
                            <div class="chat-message ai">
                                <div class="chat-bubble">您好，我可以協助解釋這個案件的查估書表、評價基準與計算結果。\n\n例如你可以問：\n• 為什麼這個因素判定為「普通」？\n• 這個修正率是怎麼得到的？\n• 最終比較價格如何計算？</div>
                            </div>
                        </div>

                        <div id="chatContext" class="chat-context">目前檢視：地價區段勘查表</div>

                        <form id="chatForm" class="chat-input-wrap">
                            <textarea id="chatInput" class="chat-input" rows="1" placeholder="針對目前案件提出問題..." required></textarea>
                            <button id="chatSend" class="chat-send" type="submit" aria-label="送出問題"><i class="fa-solid fa-paper-plane"></i></button>
                        </form>
                        <div id="chatNote" class="chat-note">目前前端已完成對話介面；正式回答需串接後端 LLM API。</div>
                    </section>
                </div>

                <div class="page-actions">
                    <a href="result.html?ui=20260912-6" class="btn btn-ai-primary" data-preserve-case>
                        查看案件結果 <i class="fa-solid fa-arrow-right ms-2"></i>
                    </a>
                </div>
            </div>
        </div>
    </section>


    <div class="mode-badge"><i class="fa-solid fa-circle-info me-1"></i>Mode: <span id="modeIndicator">-</span></div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>

    <script>
        const mode = (window.APP_CONFIG || {}).MODE || 'unknown';
        document.getElementById('modeIndicator').textContent = mode;
        CaseContext.applyCaseQueryToLinks();

        const FORM_DEFS = [
            { key: 'table1', label: '地價區段勘查表', icon: 'fa-map-location-dot' },
            { key: 'table5_2', label: '影響地價區域因素分析明細表', icon: 'fa-table-list' },
            { key: 'table4', label: '比較法調查估價表', icon: 'fa-calculator' },
        ];

        let activeFormKey = 'table1';
        let activeFormLabel = FORM_DEFS[0].label;

        function cleanFormName(value) {
            return String(value || '').replace(/\s/g, '').replace(/[（）()]/g, '').toLowerCase();
        }

        function appendChat(role, text) {
            const wrap = document.getElementById('chatMessages');
            const item = document.createElement('div');
            item.className = `chat-message ${role}`;
            const bubble = document.createElement('div');
            bubble.className = 'chat-bubble';
            bubble.textContent = text;
            item.appendChild(bubble);
            wrap.appendChild(item);
            wrap.scrollTop = wrap.scrollHeight;
        }

        function mockAnswer(question) {
            const q = question.trim();
            if (!q) return '請輸入問題。';
            return `目前是前端 Mock 回覆。你正在檢視「${activeFormLabel}」。\n\n正式版會把這個問題、案件編號、目前 PDF、評價基準與後端計算追溯資料一起送給 LLM，再回傳有依據的說明。`;
        }

        (async () => {
            const caseNo = CaseContext.currentCaseNo();
            if (!caseNo) {
                document.getElementById('loadingState').innerHTML = '<div class="state-error">缺少案號，請先建立案件。</div>';
                return;
            }

            try {
                const d = await Api.getPdf(caseNo);
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                const rawLinks = (d.pdf_urls && d.pdf_urls.length)
                    ? d.pdf_urls
                    : (d.pdf_url ? [{ form: '查估書表', url: d.pdf_url }] : []);

                const exactTable1 = rawLinks.find(x => {
                    const n = cleanFormName(x.form);
                    return n === '表1' || n.includes('地價區段勘查表');
                });
                const exactTable5 = rawLinks.find(x => {
                    const n = cleanFormName(x.form);
                    return (n === '表5-2' || n.includes('影響地價區域因素分析明細表')) && !n.includes('表4');
                });
                const exactTable4 = rawLinks.find(x => {
                    const n = cleanFormName(x.form);
                    return (n === '表4' || n.includes('比較法調查估價表')) && !n.includes('表5-2');
                });
                const combined45 = rawLinks.find(x => {
                    const n = cleanFormName(x.form);
                    return n.includes('表4') && n.includes('表5-2');
                });

                const forms = {
                    table1: { ...FORM_DEFS[0], url: exactTable1 ? exactTable1.url : null },
                    table5_2: { ...FORM_DEFS[1], url: exactTable5 ? exactTable5.url : (combined45 ? combined45.url : null) },
                    table4: { ...FORM_DEFS[2], url: exactTable4 ? exactTable4.url : (combined45 ? combined45.url : null) },
                };

                const tabs = document.getElementById('previewTabs');
                tabs.innerHTML = FORM_DEFS.map((def, index) => {
                    const f = forms[def.key];
                    return `<button type="button" class="pdf-switch-btn${index === 0 ? ' active' : ''}" data-form-key="${def.key}" ${!f.url ? 'disabled' : ''}>
                        <i class="fa-solid ${def.icon} me-1"></i>${def.label}
                    </button>`;
                }).join('');

                document.getElementById('downloadLinks').innerHTML = FORM_DEFS.map(def => {
    const f = forms[def.key];
    return f.url
        ? `<a href="${f.url}" target="_blank" rel="noopener" class="btn btn-download"><i class="fa-solid fa-download me-1"></i>${def.label}</a>`
        : `<button class="btn btn-download" disabled>${def.label}</button>`;
}).join('');


                function selectForm(key) {
                    const form = forms[key];
                    if (!form || !form.url) return;
                    activeFormKey = key;
                    activeFormLabel = form.label;
                    document.querySelectorAll('.pdf-switch-btn').forEach(btn => {
                        btn.classList.toggle('active', btn.dataset.formKey === key);
                    });
                    document.getElementById('activeFormTitle').textContent = form.label;
                    document.getElementById('pdfViewer').src = `${form.url}#toolbar=1&navpanes=0&view=FitH`;
                    document.getElementById('openCurrentPdf').href = form.url;
                    document.getElementById('chatContext').textContent = `目前檢視：${form.label}`;
                }

                tabs.addEventListener('click', event => {
                    const btn = event.target.closest('[data-form-key]');
                    if (!btn || btn.disabled) return;
                    selectForm(btn.dataset.formKey);
                });

                const initial = forms.table1.url ? 'table1' : FORM_DEFS.find(def => forms[def.key].url)?.key;
                if (initial) selectForm(initial);
            } catch (error) {
                document.getElementById('loadingState').innerHTML = '<div class="state-error">PDF 尚未產生或載入失敗。</div>';
            }
        })();

        document.getElementById('chatForm').addEventListener('submit', async event => {
            event.preventDefault();
            const input = document.getElementById('chatInput');
            const question = input.value.trim();
            if (!question) return;

            appendChat('user', question);
            input.value = '';

            try {
                const caseNo = CaseContext.currentCaseNo();
                if (typeof Api.askCaseAssistant === 'function') {
                    const response = await Api.askCaseAssistant({
                        case_no: caseNo,
                        form: activeFormKey,
                        question,
                    });
                    appendChat('ai', response.answer || '目前沒有可顯示的回答。');
                } else {
                    await new Promise(resolve => setTimeout(resolve, 450));
                    appendChat('ai', mockAnswer(question));
                }
            } catch (error) {
                appendChat('ai', 'AI 問答服務目前無法使用，請稍後再試。');
            }
        });
    </script>
</body>
</html>
