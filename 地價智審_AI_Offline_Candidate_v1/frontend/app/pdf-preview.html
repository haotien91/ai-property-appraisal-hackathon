    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>

    <script src="js/vendor/purify.min.js"></script>

    <script>
        const mode = (window.APP_CONFIG || {}).MODE || 'unknown';
        CaseContext.applyCaseQueryToLinks();

        const FORM_DEFS = [
            { key: 'table1', label: '地價區段勘查表', icon: 'fa-map-location-dot' },
            { key: 'table5_2', label: '影響地價區域因素分析明細表', icon: 'fa-table-list' },
            { key: 'table4', label: '比較法調查估價表', icon: 'fa-calculator' },
        ];

        let activeFormKey = 'table1';
        const IMAGE_DEFS = ['P001', 'P002', 'P003', 'P004'].map(code => ({
            key: code.toLowerCase(), label: `${code}區段圖`, icon: 'fa-map-location-dot',
            url: `img/${code}.jpg`, image: true,
        }));
        let activeFormLabel = FORM_DEFS[0].label;

        function cleanFormName(value) {
            return String(value || '').replace(/\s/g, '').replace(/[（）()]/g, '').toLowerCase();
        }

        function appendChat(role, text) {
            const wrap = document.getElementById('chatMessages');
            const item = document.createElement('div');
            item.className = `chat-message ${role}`;
            const bubble = document.createElement('div');
            bubble.className = 'chat-bubble';
            if (role === 'ai' && window.marked && window.DOMPurify) {
                bubble.classList.add('chat-markdown');
                bubble.innerHTML = DOMPurify.sanitize(marked.parse(String(text), { gfm: true, breaks: true }), {
                    ALLOWED_TAGS: ['p', 'br', 'strong', 'em', 'del', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'ul', 'ol', 'li', 'blockquote', 'pre', 'code', 'hr', 'table', 'thead', 'tbody', 'tr', 'th', 'td', 'a'],
                    ALLOWED_ATTR: ['href', 'title', 'start']
                });
                bubble.querySelectorAll('table').forEach(table => {
                    const scroll = document.createElement('div');
                    scroll.className = 'chat-table-scroll';
                    table.replaceWith(scroll);
                    scroll.appendChild(table);
                });
                bubble.querySelectorAll('a').forEach(link => {
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                });
            } else {
                bubble.textContent = text;
            }
            item.appendChild(bubble);
            wrap.appendChild(item);
            wrap.scrollTop = wrap.scrollHeight;
        }

        function mockAnswer(question) {
            const q = question.trim();
            if (!q) return '請輸入問題。';
            return `目前是前端 Mock 回覆。你正在檢視「${activeFormLabel}」。\n\n正式版會把這個問題、案件編號、目前 PDF、評價基準與後端計算追溯資料一起送給 LLM，再回傳有依據的說明。`;
        }

        (async () => {
            const caseNo = CaseContext.currentCaseNo();
            if (!caseNo) {
                document.getElementById('loadingState').innerHTML = '<div class="state-error">缺少案號，請先建立案件。</div>';
                return;
            }

            try {
                const d = await Api.getPdf(caseNo);
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                const rawLinks = (d.pdf_urls && d.pdf_urls.length)
                    ? d.pdf_urls
                    : (d.pdf_url ? [{ form: '查估書表', url: d.pdf_url }] : []);

                const exactTable1 = rawLinks.find(x => {
                    const n = cleanFormName(x.form);
                    return n === '表1' || n.includes('地價區段勘查表');
                });
                const exactTable5 = rawLinks.find(x => {
                    const n = cleanFormName(x.form);
                    return (n === '表5-2' || n.includes('影響地價區域因素分析明細表')) && !n.includes('表4');
                });
                const exactTable4 = rawLinks.find(x => {
                    const n = cleanFormName(x.form);
                    return (n === '表4' || n.includes('比較法調查估價表')) && !n.includes('表5-2');
                });
                const combined45 = rawLinks.find(x => {
                    const n = cleanFormName(x.form);
                    return n.includes('表4') && n.includes('表5-2');
                });

                const forms = {
                    table1: { ...FORM_DEFS[0], url: exactTable1 ? exactTable1.url : null },
                    table5_2: { ...FORM_DEFS[1], url: exactTable5 ? exactTable5.url : (combined45 ? combined45.url : null) },
                    table4: { ...FORM_DEFS[2], url: exactTable4 ? exactTable4.url : (combined45 ? combined45.url : null) },
                };

                if (d.official_pdf_url) {
                    [1, 5, 6].forEach((page, index) => {
                        const form = forms[FORM_DEFS[index].key];
                        form.url = d.official_pdf_url;
                        form.page = page;
                    });
                }

                const tabs = document.getElementById('previewTabs');
                IMAGE_DEFS.forEach(def => { forms[def.key] = def; });
                tabs.innerHTML = [...FORM_DEFS, ...IMAGE_DEFS].map((def, index) => {
                    const f = forms[def.key];
                    return `<button type="button" class="pdf-switch-btn${index === 0 ? ' active' : ''}" data-form-key="${def.key}" ${!f.url ? 'disabled' : ''}>
                        <i class="fa-solid ${def.icon} me-1"></i>${def.label}
                    </button>`;
                }).join('');

                document.getElementById('downloadLinks').innerHTML = FORM_DEFS.map(def => {
    const f = forms[def.key];
    return f.url
        ? `<a href="${f.url}" target="_blank" rel="noopener" class="btn btn-download"><i class="fa-solid fa-download me-1"></i>${def.label}</a>`
        : `<button class="btn btn-download" disabled>${def.label}</button>`;
}).join('');

                if (d.official_pdf_url && window.APP_CONFIG.LOCAL_BACKEND) {
                    const downloads = document.getElementById('downloadLinks');
                    downloads.replaceChildren();
                    const addDownload = (label, url) => {
                        const link = document.createElement('a');
                        link.className = 'btn btn-download';
                        link.textContent = label;
                        link.href = url;
                        link.target = '_blank';
                        link.rel = 'noopener';
                        downloads.appendChild(link);
                    };
                    addDownload('下載完整六頁 PDF', d.official_pdf_url);
                    Promise.all([Api.getExportExcel(caseNo), Api.getExportBundle(caseNo)])
                        .then(([excel, bundle]) => {
                            addDownload('下載 Excel', excel.excel_zip_url);
                            addDownload('下載全部書表與 JSON', bundle.bundle_zip_url);
                        }).catch(() => {
                            const notice = document.createElement('span');
                            notice.textContent = '補充匯出尚未就緒';
                            downloads.appendChild(notice);
                        });
                }


                function selectForm(key) {
                    const form = forms[key];
                    if (!form || !form.url) return;
                    activeFormKey = key;
                    activeFormLabel = form.label;
                    document.querySelectorAll('.pdf-switch-btn').forEach(btn => {
                        btn.classList.toggle('active', btn.dataset.formKey === key);
                        btn.setAttribute('aria-pressed', String(btn.dataset.formKey === key));
                    });
                    document.getElementById('activeFormTitle').textContent = form.label;
                    const pdfViewer = document.getElementById('pdfViewer');
                    pdfViewer.hidden = Boolean(form.image);
                    document.getElementById('mapPreview').hidden = !form.image;
                    if (form.image) {
                        const previewImage = document.getElementById('mapPreviewImage');
                        previewImage.src = form.url;
                        previewImage.alt = `${form.label} 區段位置圖`;
                        document.getElementById('mapOriginal').href = form.url;
                    } else {
                        // Native PDF viewers may ignore fragment-only updates on an existing frame.
                        // A new browsing context applies the requested page even for the same PDF.
                        const nextViewer = pdfViewer.cloneNode(false);
                        nextViewer.src = `${form.url.split('#')[0]}#page=${form.page || 1}&toolbar=1&navpanes=0&view=FitH`;
                        pdfViewer.replaceWith(nextViewer);
                    }
                    document.getElementById('openCurrentPdf').href = form.url;
                    document.getElementById('chatContext').textContent = `目前檢視：${form.label}`;
                }

                tabs.addEventListener('click', event => {
                    const btn = event.target.closest('[data-form-key]');
                    if (!btn || btn.disabled) return;
                    selectForm(btn.dataset.formKey);
                });

                const initial = forms.table1.url ? 'table1' : FORM_DEFS.find(def => forms[def.key].url)?.key;
                if (initial) selectForm(initial);
            } catch (error) {
                document.getElementById('loadingState').innerHTML = '<div class="state-error">PDF 尚未產生或載入失敗。</div>';
            }
        })();

        let chatVersion = null;
        const chatHistory = [];
        document.getElementById('chatForm').addEventListener('submit', async event => {
            event.preventDefault();
            const input = document.getElementById('chatInput');
            const question = input.value.trim();
            if (!question) return;

            const send = document.getElementById('chatSend');
            if (send.disabled) return;
            send.disabled = true;
            appendChat('user', question);
            input.value = '';

            try {
                const caseNo = CaseContext.currentCaseNo();
                if (typeof Api.askCaseAssistant === 'function') {
                    const response = await Api.askCaseAssistant({
                        case_no: caseNo,
                        form: activeFormKey,
                        question, version: chatVersion, history: chatHistory,
                    });
                    if (chatVersion !== response.version) chatHistory.length = 0;
                    chatVersion = response.version;
                    chatHistory.push({role:'user',text:question},{role:'assistant',text:response.answer});
                    if (chatHistory.length > 8) chatHistory.splice(0,chatHistory.length-8);
                    appendChat('ai', response.answer || '目前沒有可顯示的回答。');
                } else {
                    throw new Error('Harness API unavailable');
                }
            } catch (error) {
                appendChat('ai', 'AI 問答服務目前無法使用，請稍後再試。');
            } finally {
                send.disabled = false;
            }
        });
    </script>
</body>
</html>
